<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-label="Aganze Growing Roots Farm logo">
  <!-- Outer circle border -->
  <circle cx="150" cy="150" r="145" fill="#f7f0d6" stroke="#0d5b36" stroke-width="12"/>
  
  <!-- Inner circle background -->
  <circle cx="150" cy="150" r="135" fill="#f7f0d6"/>
  
  <!-- Landscape/ground -->
  <path d="M 50 160 Q 100 140, 150 145 Q 200 140, 250 160 L 250 220 Q 200 210, 150 215 Q 100 210, 50 220 Z" fill="#d4a574"/>
  
  <!-- Sky gradient effect -->
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e8d9b8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5f0e0;stop-opacity:1" />
    </linearGradient>
  </defs>
  <ellipse cx="150" cy="100" rx="100" ry="70" fill="url(#skyGrad)"/>
  
  <!-- Tree trunk -->
  <rect x="140" y="110" width="20" height="70" fill="#6b4423" rx="3"/>
  
  <!-- Tree foliage/leaves - green crown -->
  <g fill="#2f6b3f">
    <circle cx="150" cy="85" r="38" opacity="0.9"/>
    <ellipse cx="120" cy="105" rx="28" ry="32" opacity="0.85"/>
    <ellipse cx="180" cy="105" rx="28" ry="32" opacity="0.85"/>
  </g>
  
  <!-- Darker green leaves detail -->
  <g fill="#1d4b2a" opacity="0.6">
    <path d="M 140 75 Q 130 70, 125 85 Q 135 92, 140 75 Z"/>
    <path d="M 160 75 Q 170 70, 175 85 Q 165 92, 160 75 Z"/>
    <path d="M 150 60 Q 145 50, 150 45 Q 155 50, 150 60 Z"/>
  </g>
  
  <!-- Roots spreading down -->
  <g stroke="#0d5b36" stroke-width="8" fill="none" stroke-linecap="round">
    <path d="M 150 180 Q 130 200, 110 220"/>
    <path d="M 150 180 Q 170 200, 190 220"/>
    <path d="M 150 180 Q 145 205, 140 225"/>
    <path d="M 150 180 Q 155 205, 160 225"/>
  </g>
  
  <!-- Small barn/house detail -->
  <g fill="#a64d1a">
    <rect x="105" y="165" width="25" height="20" rx="2"/>
    <polygon points="105,165 117.5,155 130,165" fill="#8b3a0f"/>
  </g>
  
  <!-- Dollar sign in center -->
  <text x="200" y="185" font-size="36" font-weight="bold" fill="#e0a526" text-anchor="middle">$</text>
  
  <!-- Outer text ring - top -->
  <defs>
    <path id="topCurve" d="M 60,150 A 90,90 0 0,1 240,150" fill="none"/>
    <path id="bottomCurve" d="M 240,150 A 90,90 0 0,1 60,150" fill="none"/>
  </defs>
  
  <text font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#0d5b36" letter-spacing="2">
    <textPath href="#topCurve" startOffset="50%" text-anchor="middle">
      AGANZE GROWING ROOTS
    </textPath>
  </text>
  
  <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0d5b36" letter-spacing="1">
    <textPath href="#bottomCurve" startOffset="50%" text-anchor="middle">
      YOUTH ENTREPRENEURSHIP
    </textPath>
  </text>
</svg>